<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Para Ti ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400;600&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --oro: #f0c766;
    --oro-claro: #ffe9a8;
    --oro-suave: #d9a94a;
    --fondo: #07040c;
    --panel: #0d0916;
    --texto: #f2ece0;
    --texto-suave: #b9b2c4;
    --rosa: #ff3d7f;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html,body{
    height:100%;
    background: var(--fondo);
    color: var(--texto);
    font-family: 'Poppins', sans-serif;
    overflow-x:hidden;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding: 24px 14px;
    position:relative;
  }

  /* ---------- Fondo estrellado + corazones flotantes ---------- */
  #estrellas{
    position:fixed; inset:0;
    background:
      radial-gradient(1px 1px at 20% 30%, #fff 0%, transparent 60%),
      radial-gradient(1px 1px at 70% 60%, #fff 0%, transparent 60%),
      radial-gradient(1.5px 1.5px at 40% 80%, #fff 0%, transparent 60%),
      radial-gradient(1px 1px at 85% 20%, #fff 0%, transparent 60%),
      radial-gradient(1.5px 1.5px at 10% 65%, #fff 0%, transparent 60%),
      radial-gradient(1px 1px at 55% 10%, #fff 0%, transparent 60%),
      radial-gradient(1px 1px at 90% 85%, #fff 0%, transparent 60%),
      radial-gradient(1.5px 1.5px at 30% 50%, #fff 0%, transparent 60%);
    background-repeat: repeat;
    background-size: 300px 300px;
    opacity:.5;
    animation: parpadeo 4s ease-in-out infinite alternate;
    z-index:-2;
  }
  @keyframes parpadeo{ from{opacity:.3;} to{opacity:.7;} }

  .corazon-flotante{
    position:fixed;
    bottom:-40px;
    color: var(--rosa);
    opacity:.55;
    pointer-events:none;
    z-index:-1;
    animation-name: flotar;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  @keyframes flotar{
    0%{ transform: translateY(0) rotate(0deg); opacity:0; }
    10%{ opacity:.6; }
    90%{ opacity:.5; }
    100%{ transform: translateY(-110vh) rotate(25deg); opacity:0; }
  }

  /* ---------- Tarjeta principal (estilo "teléfono") ---------- */
  .tarjeta{
    width:100%;
    max-width: 420px;
    min-height: 640px;
    background: linear-gradient(180deg, #0f0a1a 0%, var(--panel) 100%);
    border: 1px solid rgba(240,199,102,.35);
    border-radius: 28px;
    box-shadow: 0 0 40px rgba(240,199,102,.12), 0 20px 60px rgba(0,0,0,.6);
    padding: 34px 24px;
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }

  .pantalla{
    display:none;
    flex-direction:column;
    align-items:center;
    flex:1;
    width:100%;
    animation: aparecer .5s ease;
  }
  .pantalla.activa{ display:flex; }

  @keyframes aparecer{
    from{ opacity:0; transform: translateY(10px); }
    to{ opacity:1; transform: translateY(0); }
  }

  h1,h2{
    font-family:'Cinzel', serif;
    letter-spacing: 2px;
    text-transform: uppercase;
    background: linear-gradient(180deg, var(--oro-claro), var(--oro-suave));
    -webkit-background-clip:text;
    background-clip:text;
    color: transparent;
    text-shadow: 0 0 22px rgba(240,199,102,.35);
    text-align:center;
  }

  /* ---------- Pantalla 1: Bloqueo ---------- */
  #pantalla-bloqueo{ justify-content:center; gap: 18px; }
  .candado{ font-size: 34px; filter: drop-shadow(0 0 10px rgba(240,199,102,.6)); }
  #pantalla-bloqueo h1{ font-size: 22px; margin-top:4px; }
  .subtitulo{ color: var(--texto-suave); font-size: 13px; letter-spacing:.5px; margin-top: -6px; }

  .puntos{ display:flex; gap: 12px; margin: 6px 0 4px; }
  .punto{
    width:12px; height:12px; border-radius:50%;
    border: 1.5px solid var(--oro-suave);
    background: transparent;
    transition: all .2s ease;
  }
  .punto.lleno{ background: var(--oro); box-shadow: 0 0 10px var(--oro); }

  .puntos.error .punto{ border-color: var(--rosa); }
  .puntos.error{ animation: sacudir .4s ease; }
  @keyframes sacudir{
    0%,100%{ transform: translateX(0); }
    20%{ transform: translateX(-8px); }
    40%{ transform: translateX(8px); }
    60%{ transform: translateX(-6px); }
    80%{ transform: translateX(6px); }
  }

  .teclado{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-top: 8px;
  }
  .tecla{
    width: 62px; height: 62px;
    border-radius:50%;
    border: 1px solid rgba(240,199,102,.4);
    background: rgba(240,199,102,.05);
    color: var(--oro-claro);
    font-family:'Cinzel', serif;
    font-size: 20px;
    cursor:pointer;
    transition: all .15s ease;
  }
  .tecla:hover{ background: rgba(240,199,102,.15); box-shadow: 0 0 14px rgba(240,199,102,.4); }
  .tecla:active{ transform: scale(.92); }
  .tecla.especial{ font-size:15px; opacity:.85; }

  /* ---------- Pantalla 2: Principal ---------- */
  #pantalla-principal{ justify-content:center; gap: 22px; }
  #pantalla-principal h2{ font-size: 21px; }

  .contador{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    width:100%;
  }
  .unidad{
    border: 1px solid rgba(240,199,102,.4);
    border-radius: 10px;
    padding: 10px 4px;
    text-align:center;
    box-shadow: 0 0 12px rgba(240,199,102,.15) inset;
  }
  .unidad .numero{
    font-family:'Cinzel', serif;
    font-size: 26px;
    color: var(--oro-claro);
    text-shadow: 0 0 10px rgba(240,199,102,.5);
  }
  .unidad .etiqueta{
    font-size: 10px;
    letter-spacing: 1px;
    color: var(--texto-suave);
    text-transform: uppercase;
    margin-top: 2px;
  }

  .botones{ display:flex; gap: 12px; flex-wrap:wrap; justify-content:center; margin-top: 6px; }
  .boton{
    padding: 12px 22px;
    border-radius: 999px;
    border: 1px solid var(--oro-suave);
    background: transparent;
    color: var(--oro-claro);
    font-family:'Cinzel', serif;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor:pointer;
    transition: all .2s ease;
  }
  .boton.principal{
    background: linear-gradient(90deg, #ffb37a, var(--oro));
    color: #2a1b04;
    border: none;
    box-shadow: 0 0 16px rgba(240,199,102,.5);
  }
  .boton:hover{ transform: translateY(-2px); box-shadow: 0 4px 16px rgba(240,199,102,.35); }
  .boton.volver{ margin-top: 22px; }

  /* ---------- Pantalla 3: Recuerdos ---------- */
  #pantalla-recuerdos{ justify-content:center; gap: 20px; }

  .carrusel{
    position:relative;
    width:100%;
    height: 260px;
    perspective: 1000px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .tarjeta-recuerdo{
    position:absolute;
    width: 150px;
    height: 210px;
    border-radius: 10px;
    background: linear-gradient(160deg, var(--recuerdo-a, #3a2b52), var(--recuerdo-b, #1a1130));
    border: 2px solid var(--oro);
    box-shadow: 0 0 18px rgba(240,199,102,.4);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-size: 52px;
    text-align:center;
    padding: 10px;
    cursor:pointer;
    transition: transform .4s ease, opacity .4s ease, z-index 0s;
    user-select:none;
  }
  .tarjeta-recuerdo img{
    width:100%; height:70%; object-fit:cover; border-radius:6px; margin-bottom:8px;
  }
  .tarjeta-recuerdo .titulo-recuerdo{
    font-family:'Poppins',sans-serif;
    font-size: 11px;
    color: var(--texto);
    margin-top: 6px;
  }

  .flechas{ display:flex; gap: 30px; }
  .flecha{
    background:none; border:none; color: var(--oro);
    font-size: 26px; cursor:pointer; opacity:.8;
  }
  .flecha:hover{ opacity:1; text-shadow: 0 0 10px var(--oro); }

  /* ---------- Pantalla 4: Carta ---------- */
  #pantalla-carta{ justify-content:center; gap: 18px; }
  .sobre-carta{
    width:100%;
    min-height: 300px;
    border: 1px solid rgba(240,199,102,.5);
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 0 20px rgba(240,199,102,.15) inset;
    font-size: 14px;
    line-height: 1.7;
    color: var(--texto);
    white-space: pre-wrap;
  }
  .cursor-escritura{
    display:inline-block;
    width: 2px;
    background: var(--oro-claro);
    margin-left: 1px;
    animation: parpadear-cursor 1s step-end infinite;
  }
  @keyframes parpadear-cursor{ 50%{ opacity:0; } }

  .firma{
    font-family:'Dancing Script', cursive;
    font-size: 30px;
    color: var(--oro-claro);
    text-align:right;
    margin-top: 10px;
    opacity:0;
    transition: opacity .8s ease;
  }
  .firma.visible{ opacity:1; }

  footer.credito{
    text-align:center;
    color: var(--texto-suave);
    font-size: 11px;
    margin-top: 22px;
    letter-spacing:.5px;
  }

  @media (max-width: 380px){
    .tecla{ width: 54px; height:54px; font-size:17px; }
    .unidad .numero{ font-size: 21px; }
  }
</style>
</head>
<body>

<div id="estrellas"></div>

<div class="tarjeta">

  <!-- ================= PANTALLA 1: BLOQUEO ================= -->
  <section id="pantalla-bloqueo" class="pantalla activa">
    <div class="candado">🔒</div>
    <h1 id="titulo-bloqueo">Feliz Aniversario</h1>
    <p class="subtitulo">Ingresa nuestra fecha</p>
    <div class="puntos" id="puntos"></div>
    <div class="teclado" id="teclado"></div>
  </section>

  <!-- ================= PANTALLA 2: PRINCIPAL ================= -->
  <section id="pantalla-principal" class="pantalla">
    <h2>Nuestro Tiempo Juntos</h2>
    <div class="contador" id="contador"></div>
    <div class="botones">
      <button class="boton principal" onclick="mostrarPantalla('recuerdos')">Ver Recuerdos</button>
      <button class="boton" onclick="mostrarPantalla('carta')">Leer Carta</button>
    </div>
    <footer class="credito">Hecho con ❤️ por Fernando</footer>
  </section>

  <!-- ================= PANTALLA 3: RECUERDOS ================= -->
  <section id="pantalla-recuerdos" class="pantalla">
    <h2>Recuerdos</h2>
    <div class="carrusel" id="carrusel"></div>
    <div class="flechas">
      <button class="flecha" onclick="moverCarrusel(-1)">&#10094;</button>
      <button class="flecha" onclick="moverCarrusel(1)">&#10095;</button>
    </div>
    <button class="boton volver" onclick="mostrarPantalla('principal')">Volver</button>
  </section>

  <!-- ================= PANTALLA 4: CARTA ================= -->
  <section id="pantalla-carta" class="pantalla">
    <div class="sobre-carta" id="texto-carta"></div>
    <div class="firma" id="firma-carta">Love You</div>
    <button class="boton volver" onclick="mostrarPantalla('principal')">Volver</button>
  </section>

</div>

<script>
/* =========================================================================
   CONFIGURACIÓN — edita solo esta sección para personalizar el regalo
   ========================================================================= */
const CONFIG = {
  // Fecha y hora exacta del aniversario (año-mes-día T hora:minuto:segundo)
  fechaInicio: "2025-02-14T00:00:00",

  // Clave de 6 dígitos para desbloquear. Si la dejas en null, se genera
  // automáticamente a partir de fechaInicio en formato DDMMAA.
  clave: null,

  // Texto de la pantalla de bloqueo
  tituloBloqueo: "Feliz Aniversario",

  // Recuerdos del carrusel. Puedes usar "emoji" o una imagen real con "img"
  // (ruta local o enlace). "colorA/colorB" son el degradado de fondo de la
  // tarjeta cuando no hay imagen.
  recuerdos: [
    { emoji: "📸", titulo: "Nuestra primera foto juntos", colorA: "#4a2c6d", colorB: "#1a1130" },
    { emoji: "💌", titulo: "El primer mensaje", colorA: "#6d2c55", colorB: "#1a1130" },
    { emoji: "🎬", titulo: "Nuestra primera cita", colorA: "#2c4a6d", colorB: "#1a1130" },
    { emoji: "🎂", titulo: "Ese cumpleaños inolvidable", colorA: "#6d572c", colorB: "#1a1130" },
    { emoji: "✈️", titulo: "Nuestro primer viaje", colorA: "#2c6d5a", colorB: "#1a1130" },
  ],

  // Carta de amor. Cada elemento del arreglo es un párrafo (se escriben
  // en orden, con una pequeña pausa entre cada uno).
  carta: [
    "Amor de mi vida,",
    "Gracias por ser el refugio de mis días, por cada instante, cada risa y hasta por los silencios que hemos compartido.",
    "Eres el motivo por el que sonrío sin razón aparente. Quiero que sepas, hoy y siempre, que mi lugar favorito en el mundo es a tu lado.",
    "Feliz aniversario. Y por todas las vidas que nos faltan."
  ],

  // Recordar el desbloqueo mientras la pestaña siga abierta (no pide la
  // clave de nuevo si vuelves a la pantalla de bloqueo por error)
  recordarDesbloqueo: true
};
/* ========================================================================= */

// ---------- Utilidad: generar clave automática DDMMAA ----------
function claveAutomatica(fechaISO){
  const f = new Date(fechaISO);
  const dd = String(f.getDate()).padStart(2, "0");
  const mm = String(f.getMonth() + 1).padStart(2, "0");
  const aa = String(f.getFullYear()).slice(-2);
  return dd + mm + aa;
}
const CLAVE_CORRECTA = (CONFIG.clave || claveAutomatica(CONFIG.fechaInicio)).toString();

document.getElementById("titulo-bloqueo").textContent = CONFIG.tituloBloqueo;

// ---------- Fondo: corazones flotantes ----------
function crearCorazones(cantidad){
  for(let i = 0; i < cantidad; i++){
    const c = document.createElement("div");
    c.className = "corazon-flotante";
    c.textContent = "❤";
    c.style.left = Math.random() * 100 + "vw";
    c.style.fontSize = (10 + Math.random() * 18) + "px";
    c.style.animationDuration = (8 + Math.random() * 10) + "s";
    c.style.animationDelay = (Math.random() * 10) + "s";
    document.body.appendChild(c);
  }
}
crearCorazones(18);

// ---------- Navegación entre pantallas ----------
function mostrarPantalla(nombre){
  document.querySelectorAll(".pantalla").forEach(p => p.classList.remove("activa"));
  document.getElementById("pantalla-" + nombre).classList.add("activa");
  if(nombre === "carta") iniciarCarta();
  if(nombre === "recuerdos") renderizarCarrusel();
}

// ---------- Pantalla 1: teclado numérico de bloqueo ----------
let entrada = "";
const puntosEl = document.getElementById("puntos");
const tecladoEl = document.getElementById("teclado");

for(let i = 0; i < CLAVE_CORRECTA.length; i++){
  const p = document.createElement("div");
  p.className = "punto";
  puntosEl.appendChild(p);
}

const teclas = ["1","2","3","4","5","6","7","8","9","C","0","⌫"];
teclas.forEach(t => {
  const b = document.createElement("button");
  b.className = "tecla" + (t === "C" || t === "⌫" ? " especial" : "");
  b.textContent = t;
  b.onclick = () => manejarTecla(t);
  tecladoEl.appendChild(b);
});

function actualizarPuntos(){
  const puntos = puntosEl.children;
  for(let i = 0; i < puntos.length; i++){
    puntos[i].classList.toggle("lleno", i < entrada.length);
  }
}

function manejarTecla(t){
  if(t === "C"){
    entrada = "";
  } else if(t === "⌫"){
    entrada = entrada.slice(0, -1);
  } else if(entrada.length < CLAVE_CORRECTA.length){
    entrada += t;
  }
  actualizarPuntos();

  if(entrada.length === CLAVE_CORRECTA.length){
    if(entrada === CLAVE_CORRECTA){
      if(CONFIG.recordarDesbloqueo) sessionStorage.setItem("desbloqueado", "1");
      setTimeout(() => mostrarPantalla("principal"), 250);
    } else {
      puntosEl.classList.add("error");
      setTimeout(() => {
        puntosEl.classList.remove("error");
        entrada = "";
        actualizarPuntos();
      }, 500);
    }
  }
}

if(CONFIG.recordarDesbloqueo && sessionStorage.getItem("desbloqueado") === "1"){
  mostrarPantalla("principal");
}

// ---------- Pantalla 2: contador de tiempo juntos ----------
const unidades = [
  { clave: "years", etiqueta: "Años" },
  { clave: "months", etiqueta: "Meses" },
  { clave: "days", etiqueta: "Días" },
  { clave: "hours", etiqueta: "Horas" },
  { clave: "minutes", etiqueta: "Min" },
  { clave: "seconds", etiqueta: "Seg" },
];
const contadorEl = document.getElementById("contador");
unidades.forEach(u => {
  const div = document.createElement("div");
  div.className = "unidad";
  div.innerHTML = `<div class="numero" id="valor-${u.clave}">0</div><div class="etiqueta">${u.etiqueta}</div>`;
  contadorEl.appendChild(div);
});

function calcularDiferencia(inicio, ahora){
  let years = ahora.getFullYear() - inicio.getFullYear();
  let months = ahora.getMonth() - inicio.getMonth();
  let days = ahora.getDate() - inicio.getDate();
  let hours = ahora.getHours() - inicio.getHours();
  let minutes = ahora.getMinutes() - inicio.getMinutes();
  let seconds = ahora.getSeconds() - inicio.getSeconds();

  if(seconds < 0){ seconds += 60; minutes--; }
  if(minutes < 0){ minutes += 60; hours--; }
  if(hours < 0){ hours += 24; days--; }
  if(days < 0){
    const ultimoDiaMesAnterior = new Date(ahora.getFullYear(), ahora.getMonth(), 0).getDate();
    days += ultimoDiaMesAnterior;
    months--;
  }
  if(months < 0){ months += 12; years--; }

  return { years, months, days, hours, minutes, seconds };
}

function actualizarContador(){
  const inicio = new Date(CONFIG.fechaInicio);
  const diff = calcularDiferencia(inicio, new Date());
  unidades.forEach(u => {
    document.getElementById("valor-" + u.clave).textContent = Math.max(diff[u.clave], 0);
  });
}
actualizarContador();
setInterval(actualizarContador, 1000);

// ---------- Pantalla 3: carrusel de recuerdos ----------
const carruselEl = document.getElementById("carrusel");
let indiceActual = 0;

function renderizarCarrusel(){
  carruselEl.innerHTML = "";
  const total = CONFIG.recuerdos.length;

  CONFIG.recuerdos.forEach((r, i) => {
    let offset = i - indiceActual;
    // Normaliza el offset para que el carrusel sea circular
    if(offset > total / 2) offset -= total;
    if(offset < -total / 2) offset += total;

    const div = document.createElement("div");
    div.className = "tarjeta-recuerdo";
    div.style.setProperty("--recuerdo-a", r.colorA || "#3a2b52");
    div.style.setProperty("--recuerdo-b", r.colorB || "#1a1130");

    if(Math.abs(offset) > 2){
      div.style.opacity = "0";
      div.style.pointerEvents = "none";
    } else {
      div.style.transform = `translateX(${offset * 95}px) rotateY(${offset * -28}deg) scale(${1 - Math.abs(offset) * 0.18})`;
      div.style.zIndex = 10 - Math.abs(offset);
      div.style.opacity = offset === 0 ? "1" : "0.7";
    }

    div.innerHTML = r.img
      ? `<img src="${r.img}" alt="${r.titulo || ''}"><div class="titulo-recuerdo">${r.titulo || ""}</div>`
      : `<div>${r.emoji || "❤️"}</div><div class="titulo-recuerdo">${r.titulo || ""}</div>`;

    div.onclick = () => { indiceActual = i; renderizarCarrusel(); };
    carruselEl.appendChild(div);
  });
}

function moverCarrusel(direccion){
  const total = CONFIG.recuerdos.length;
  indiceActual = (indiceActual + direccion + total) % total;
  renderizarCarrusel();
}

// Deslizar con el dedo en móviles
let toqueInicioX = null;
carruselEl.addEventListener("touchstart", e => toqueInicioX = e.touches[0].clientX);
carruselEl.addEventListener("touchend", e => {
  if(toqueInicioX === null) return;
  const diffX = e.changedTouches[0].clientX - toqueInicioX;
  if(Math.abs(diffX) > 40) moverCarrusel(diffX < 0 ? 1 : -1);
  toqueInicioX = null;
});

// ---------- Pantalla 4: carta con efecto de máquina de escribir ----------
let cartaIniciada = false;
function iniciarCarta(){
  if(cartaIniciada) return; // solo se anima una vez por sesión
  cartaIniciada = true;

  const contenedor = document.getElementById("texto-carta");
  const firma = document.getElementById("firma-carta");
  contenedor.innerHTML = "";
  firma.classList.remove("visible");

  const cursor = document.createElement("span");
  cursor.className = "cursor-escritura";

  let parrafo = 0, caracter = 0;

  function escribirSiguiente(){
    if(parrafo >= CONFIG.carta.length){
      cursor.remove();
      setTimeout(() => firma.classList.add("visible"), 300);
      return;
    }
    const textoParrafo = CONFIG.carta[parrafo];

    if(caracter === 0 && parrafo > 0){
      contenedor.appendChild(document.createElement("br"));
      contenedor.appendChild(document.createElement("br"));
    }

    if(caracter < textoParrafo.length){
      cursor.remove();
      contenedor.appendChild(document.createTextNode(textoParrafo[caracter]));
      contenedor.appendChild(cursor);
      caracter++;
      setTimeout(escribirSiguiente, 22 + Math.random() * 18);
    } else {
      parrafo++;
      caracter = 0;
      setTimeout(escribirSiguiente, 350);
    }
  }
  contenedor.appendChild(cursor);
  escribirSiguiente();
}
</script>
</body>
</html>
